# Reverse-proxy snippet for n8n.example.com.
#
# Put the map in the http context. Put the server blocks next to your
# other sites. This pack does not install nginx and does not reload it.
#
# n8n's reverse-proxy page says to set N8N_WEBHOOK_URL and N8N_PROXY_HOPS,
# and to forward the original request from the last proxy. The header
# lines below are this pack's snippet, not a verbatim n8n file.
# Check upstream docs for your version.
#
# TLS paths are examples. Replace them with the files from your issuer.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name n8n.example.com;
    return 301 https://n8n.example.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name n8n.example.com;

    ssl_certificate     /etc/nginx/certs/n8n.example.com.fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/n8n.example.com.key.pem;

    # n8n documents N8N_PAYLOAD_SIZE_MAX default 16 (MiB). This line
    # matches that default. Raise both together if you change it.
    # Check upstream docs.
    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:5678;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Editor push uses websockets unless N8N_PUSH_BACKEND is changed.
        # Check upstream docs.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
    }
}
